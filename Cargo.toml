[package]
name = "arctic"
version = "0.1.0"
authors = ["Ian Goldberg <iang@uwaterloo.ca>"]
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
curve25519-dalek = { version = "4.1", features = ["rand_core"] }
sha2 = "0.10"
subtle = "2.6"
bs58 = "0.5"
hex = "0.4"
itertools = "0.12"
rand = "0.8"

