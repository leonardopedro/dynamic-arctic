name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The crate pins its toolchain in rust-toolchain.toml (1.99.0 — consumed by
  # australVM's arctic_authority via path dep). CI installs exactly that
  # channel from the file instead of pinning a channel here, so a deliberate
  # bump in rust-toolchain.toml is picked up automatically.
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_protocol is a path dep on ../unfer (the default 'server'
      # feature), so the workspace cannot resolve without the sibling —
      # this job's clippy failed on every run without it.
      - name: Checkout unfer as sibling (path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      # First cargo invocation auto-installs the rust-toolchain.toml channel
      # and makes it the active toolchain for this directory.
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - name: Add lint components
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # Swatinem/rust-cache@v2
      # Scoped to this repo's own files (rustfmt + git ls-files), not
      # `cargo fmt --all`: --all walks path dependencies and would make
      # *this* repo's gate red on a formatting drift inside unfer — the
      # cross-repo coupling velysterm's format job deliberately dropped.
      - run: rustfmt --edition 2021 --check $(git ls-files '*.rs')
      # --all-features also lints the 'server' authority binary (axum/tokio).
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (server on + library-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
      # unfer_protocol is a path dep on ../unfer (the default 'server'
      # feature), so `--all-features` cannot resolve without the sibling.
      - name: Checkout unfer as sibling (path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - name: Activate pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # Swatinem/rust-cache@v2
      # Default features include the 'server' binary; threshold-signature tests
      # live in the lib (lagrange, arctic_core, shine_core).
      - name: cargo test (all features)
        run: cargo test --all-features --locked
      # Library-only, no default features: the cheap path-dep shape that
      # unfer_consensus consumes (threshold signatures, no AT-Protocol server).
      - name: cargo test (no default features)
        run: cargo test --no-default-features --lib --locked
